name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
      - name: Run tests
        run: |
          mkdir -p ci_logs
          set -o pipefail
          pytest -q | tee ci_logs/pytest.log
      - name: Commit logs
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci_logs || true
          git commit -m "ci: test logs [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || echo "push skipped"
